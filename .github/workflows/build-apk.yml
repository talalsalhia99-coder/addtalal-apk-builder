name: Build AddTalal APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: true
        default: "AddTalal App"
      package_name:
        description: "Android package name"
        required: true
        default: "com.addtalal.app"
      build_mode:
        description: "Build mode: url or html"
        required: true
        default: "url"
      website_url:
        description: "Website URL for URL mode"
        required: false
        default: "https://throbbing-sun-13b2.talalsalhia10.workers.dev"
      html_base64:
        description: "Base64 HTML code for HTML mode"
        required: false
        default: ""
      icon_base64:
        description: "Base64 app icon data URL"
        required: false
        default: ""
      version_code:
        description: "Version code"
        required: true
        default: "1"
      version_name:
        description: "Version name"
        required: true
        default: "1.0"

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create universal Android WebView project
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          BUILD_MODE: ${{ github.event.inputs.build_mode }}
          WEBSITE_URL: ${{ github.event.inputs.website_url }}
          HTML_BASE64: ${{ github.event.inputs.html_base64 }}
          ICON_BASE64: ${{ github.event.inputs.icon_base64 }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          set -e

          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          mkdir -p app/src/main/java/$PACKAGE_PATH
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'AddTalalUniversalApp'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '$PACKAGE_NAME'
              compileSdk 35

              defaultConfig {
                  applicationId '$PACKAGE_NAME'
                  minSdk 23
                  targetSdk 35
                  versionCode $VERSION_CODE
                  versionName '$VERSION_NAME'
              }
          }
          EOF

          python3 - <<'PY'
          import os, base64, html, re, json

          app_name = os.environ.get("APP_NAME", "AddTalal App")
          package_name = os.environ.get("PACKAGE_NAME", "com.addtalal.app")
          build_mode = (os.environ.get("BUILD_MODE", "url") or "url").lower().strip()
          website_url = os.environ.get("WEBSITE_URL", "https://example.com")
          html_base64 = os.environ.get("HTML_BASE64", "")
          icon_base64 = os.environ.get("ICON_BASE64", "")

          # strings.xml
          with open("app/src/main/res/values/strings.xml", "w", encoding="utf-8") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n')
              f.write('<resources>\n')
              f.write('    <string name="app_name">' + html.escape(app_name) + '</string>\n')
              f.write('</resources>\n')

          # styles.xml
          with open("app/src/main/res/values/styles.xml", "w", encoding="utf-8") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0b1220</item>
                  <item name="android:navigationBarColor">#0b1220</item>
              </style>
          </resources>
          ''')

          # HTML mode: put user code inside APK assets
          start_url = website_url
          if build_mode == "html":
              raw = html_base64.strip()
              if "," in raw:
                  raw = raw.split(",", 1)[1]
              if raw:
                  try:
                      missing = len(raw) % 4
                      if missing:
                          raw += "=" * (4 - missing)
                      html_bytes = base64.b64decode(raw)
                      with open("app/src/main/assets/index.html", "wb") as f:
                          f.write(html_bytes)
                  except Exception:
                      with open("app/src/main/assets/index.html", "w", encoding="utf-8") as f:
                          f.write("<!doctype html><html><body><h1>HTML decode error</h1></body></html>")
              else:
                  with open("app/src/main/assets/index.html", "w", encoding="utf-8") as f:
                      f.write("<!doctype html><html><body><h1>AddTalal App</h1></body></html>")
              start_url = "file:///android_asset/index.html"

          # App icon: uploaded icon or default vector
          icon_written = False
          icon_data = icon_base64.strip()
          if icon_data:
              try:
                  ext = "png"
                  if icon_data.startswith("data:image/jpeg") or icon_data.startswith("data:image/jpg"):
                      ext = "jpg"
                  elif icon_data.startswith("data:image/webp"):
                      ext = "webp"
                  elif icon_data.startswith("data:image/png"):
                      ext = "png"

                  raw_icon = icon_data.split(",", 1)[1] if "," in icon_data else icon_data
                  missing = len(raw_icon) % 4
                  if missing:
                      raw_icon += "=" * (4 - missing)

                  with open(f"app/src/main/res/drawable/ic_launcher.{ext}", "wb") as f:
                      f.write(base64.b64decode(raw_icon))
                  icon_written = True
              except Exception:
                  icon_written = False

          if not icon_written:
              with open("app/src/main/res/drawable/ic_launcher.xml", "w", encoding="utf-8") as f:
                  f.write('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#111827"
                  android:pathData="M18,8h72a18,18 0,0 1,18 18v56a18,18 0,0 1,-18 18H18A18,18 0,0 1,0 82V26A18,18 0,0 1,18 8z"/>
              <path
                  android:fillColor="#7C3AED"
                  android:pathData="M54,20L84,88H70L64,74H44L38,88H24L54,20zM49,62h10L54,48z"/>
              <path
                  android:fillColor="#22C55E"
                  android:pathData="M76,16h8v10h10v8H84v10h-8V34H66v-8h10z"/>
          </vector>
          ''')

          # Manifest
          with open("app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(f'''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''')

          # MainActivity.java
          package_path = package_name.replace(".", "/")
          java_path = f"app/src/main/java/{package_path}/MainActivity.java"
          start_url_java = json.dumps(start_url)

          with open(java_path, "w", encoding="utf-8") as f:
              f.write(f'''package {package_name};

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.Window;
          import android.view.WindowManager;

          public class MainActivity extends Activity {{
              private WebView webView;
              private static final String START_URL = {start_url_java};

              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setDatabaseEnabled(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl(START_URL);
              }}

              @Override
              public void onBackPressed() {{
                  if (webView != null && webView.canGoBack()) {{
                      webView.goBack();
                  }} else {{
                      super.onBackPressed();
                  }}
              }}
          }}
          ''')
          PY

      - name: Build APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/AddTalal-App-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AddTalal-Generated-APK
          path: output/AddTalal-App-${{ github.run_number }}.apk

      - name: Create direct APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AddTalal APK Build #${{ github.run_number }}
          files: output/AddTalal-App-${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

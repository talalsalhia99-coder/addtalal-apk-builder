<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>تطبيق كاميرا ومايك</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(180deg,#07111f,#111827);
  color:#fff;
  min-height:100vh;
}

.app{
  max-width:520px;
  margin:0 auto;
  padding:18px;
}

.header{
  text-align:center;
  padding:18px 8px 12px;
}

.logo{
  width:82px;
  height:82px;
  margin:0 auto 14px;
  border-radius:24px;
  background:linear-gradient(135deg,#7c3aed,#2563eb,#22c55e);
  display:grid;
  place-items:center;
  font-size:34px;
  font-weight:900;
  box-shadow:0 18px 45px rgba(0,0,0,.35);
}

h1{
  margin:0;
  font-size:27px;
  line-height:1.4;
}

.header p{
  margin:10px 0 0;
  color:#cbd5e1;
  font-size:15px;
  line-height:1.8;
}

.card{
  background:#111827;
  border:1px solid #263247;
  border-radius:24px;
  padding:14px;
  margin-top:14px;
  box-shadow:0 18px 45px rgba(0,0,0,.32);
}

.videoBox{
  background:#020617;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #334155;
}

video{
  width:100%;
  height:360px;
  object-fit:cover;
  display:block;
  background:#020617;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

button,label.fileBtn{
  border:0;
  outline:0;
  padding:15px 10px;
  border-radius:16px;
  font-size:15px;
  font-weight:900;
  color:white;
  text-align:center;
  cursor:pointer;
  background:#334155;
}

.primary{
  background:linear-gradient(135deg,#7c3aed,#2563eb);
}

.green{
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.red{
  background:linear-gradient(135deg,#ef4444,#b91c1c);
}

.orange{
  background:linear-gradient(135deg,#f59e0b,#ea580c);
}

.dark{
  background:#0f172a;
}

.full{
  grid-column:1/-1;
}

.status{
  margin-top:14px;
  padding:13px;
  border-radius:16px;
  background:#0b1220;
  border:1px solid #263247;
  color:#dbeafe;
  line-height:1.8;
  font-size:14px;
  min-height:48px;
}

.preview{
  margin-top:14px;
}

img,audio{
  width:100%;
  margin-top:10px;
  border-radius:16px;
}

img{
  border:1px solid #334155;
  background:#020617;
}

a.download{
  display:block;
  text-align:center;
  text-decoration:none;
  margin-top:10px;
  padding:14px;
  border-radius:16px;
  background:linear-gradient(135deg,#16a34a,#22c55e);
  color:white;
  font-weight:900;
}

input[type="file"]{
  display:none;
}

.info{
  color:#94a3b8;
  font-size:12px;
  line-height:1.8;
  margin-top:12px;
}

.locationBox{
  margin-top:10px;
  padding:12px;
  border-radius:16px;
  background:#020617;
  border:1px solid #263247;
  color:#cbd5e1;
  line-height:1.7;
  font-size:13px;
  display:none;
}

@media(max-width:420px){
  video{
    height:310px;
  }

  h1{
    font-size:23px;
  }

  button,label.fileBtn{
    font-size:14px;
    padding:13px 8px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">AT</div>
    <h1>تطبيق الكاميرا والمايك</h1>
    <p>افتح الكاميرا، التقط صورة، سجّل صوت، اختر ملف، واعرض الموقع الجغرافي.</p>
  </div>

  <div class="card">
    <div class="videoBox">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="controls">
      <button class="primary" onclick="startCamera()">فتح الكاميرا</button>
      <button class="orange" onclick="switchCamera()">تبديل الكاميرا</button>

      <button class="green" onclick="takePhoto()">التقاط صورة</button>
      <button class="red" onclick="stopCamera()">إيقاف الكاميرا</button>

      <button class="primary full" id="recordBtn" onclick="toggleRecording()">بدء تسجيل الصوت</button>

      <label class="fileBtn dark full">
        اختيار صورة / فيديو / ملف
        <input id="fileInput" type="file" accept="image/*,video/*,audio/*,.pdf,.txt" onchange="handleFile(event)">
      </label>

      <button class="orange full" onclick="getLocation()">عرض موقعي الجغرافي</button>
    </div>

    <div class="status" id="status">
      اضغط فتح الكاميرا، ثم وافق على الصلاحيات من الهاتف.
    </div>

    <div class="locationBox" id="locationBox"></div>

    <div class="preview">
      <canvas id="canvas" style="display:none"></canvas>

      <img id="photo" alt="الصورة الملتقطة" style="display:none">
      <a id="photoDownload" class="download" style="display:none" download="photo.png">تحميل الصورة</a>

      <audio id="audio" controls style="display:none"></audio>
      <a id="audioDownload" class="download" style="display:none" download="recording.webm">تحميل التسجيل الصوتي</a>

      <div id="filePreview"></div>
    </div>

    <div class="info">
      ملاحظة: إذا طلب الهاتف صلاحيات الكاميرا أو المايك، اختر سماح. إذا كانت نسخة قديمة من التطبيق مثبتة، احذفها وثبّت النسخة الجديدة.
    </div>
  </div>

</div>

<script>
let stream = null;
let facingMode = "environment";
let recorder = null;
let audioChunks = [];
let recording = false;

const video = document.getElementById("video");
const statusBox = document.getElementById("status");

function setStatus(text){
  statusBox.textContent = text;
}

function hasMedia(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

async function startCamera(){
  try{
    if(!hasMedia()){
      setStatus("هذا الجهاز أو هذا المتصفح لا يدعم تشغيل الكاميرا مباشرة.");
      return;
    }

    stopCamera();

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:facingMode,
        width:{ ideal:1280 },
        height:{ ideal:720 }
      },
      audio:true
    });

    video.srcObject = stream;
    await video.play();

    setStatus("تم تشغيل الكاميرا والمايك بنجاح.");
  }catch(error){
    setStatus("تعذر تشغيل الكاميرا أو المايك: " + error.message);
  }
}

function stopCamera(){
  if(stream){
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
}

async function switchCamera(){
  facingMode = facingMode === "environment" ? "user" : "environment";
  await startCamera();
}

function takePhoto(){
  if(!stream){
    setStatus("افتح الكاميرا أولًا قبل التقاط الصورة.");
    return;
  }

  const canvas = document.getElementById("canvas");
  const photo = document.getElementById("photo");
  const link = document.getElementById("photoDownload");

  const width = video.videoWidth || 720;
  const height = video.videoHeight || 1280;

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video,0,0,width,height);

  const dataUrl = canvas.toDataURL("image/png");

  photo.src = dataUrl;
  photo.style.display = "block";

  link.href = dataUrl;
  link.style.display = "block";

  setStatus("تم التقاط الصورة بنجاح.");
}

async function toggleRecording(){
  if(recording){
    stopRecording();
  }else{
    await startRecording();
  }
}

async function startRecording(){
  try{
    if(!hasMedia()){
      setStatus("هذا الجهاز لا يدعم تسجيل الصوت من المتصفح.");
      return;
    }

    if(!stream){
      stream = await navigator.mediaDevices.getUserMedia({
        audio:true,
        video:false
      });
    }

    audioChunks = [];

    recorder = new MediaRecorder(stream);

    recorder.ondataavailable = function(event){
      if(event.data && event.data.size > 0){
        audioChunks.push(event.data);
      }
    };

    recorder.onstop = function(){
      const blob = new Blob(audioChunks,{ type:"audio/webm" });
      const url = URL.createObjectURL(blob);

      const audio = document.getElementById("audio");
      const link = document.getElementById("audioDownload");

      audio.src = url;
      audio.style.display = "block";

      link.href = url;
      link.style.display = "block";

      setStatus("تم حفظ التسجيل الصوتي. يمكنك تشغيله أو تحميله.");
    };

    recorder.start();

    recording = true;
    document.getElementById("recordBtn").textContent = "إيقاف تسجيل الصوت";
    setStatus("جاري تسجيل الصوت...");
  }catch(error){
    setStatus("تعذر تشغيل تسجيل الصوت: " + error.message);
  }
}

function stopRecording(){
  if(recorder && recording){
    recorder.stop();
    recording = false;
    document.getElementById("recordBtn").textContent = "بدء تسجيل الصوت";
  }
}

function handleFile(event){
  const file = event.target.files[0];
  const box = document.getElementById("filePreview");

  if(!file){
    return;
  }

  const url = URL.createObjectURL(file);
  box.innerHTML = "";

  if(file.type.startsWith("image/")){
    const img = document.createElement("img");
    img.src = url;
    box.appendChild(img);
  }else if(file.type.startsWith("video/")){
    const vid = document.createElement("video");
    vid.src = url;
    vid.controls = true;
    vid.style.marginTop = "10px";
    vid.style.borderRadius = "16px";
    box.appendChild(vid);
  }else if(file.type.startsWith("audio/")){
    const aud = document.createElement("audio");
    aud.src = url;
    aud.controls = true;
    aud.style.display = "block";
    box.appendChild(aud);
  }else{
    const div = document.createElement("div");
    div.className = "status";
    div.textContent = "تم اختيار الملف: " + file.name;
    box.appendChild(div);
  }

  setStatus("تم اختيار ملف: " + file.name);
}

function getLocation(){
  const locationBox = document.getElementById("locationBox");

  if(!navigator.geolocation){
    setStatus("الموقع الجغرافي غير مدعوم في هذا الجهاز.");
    return;
  }

  setStatus("جاري جلب الموقع الجغرافي...");

  navigator.geolocation.getCurrentPosition(
    function(pos){
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;

      locationBox.style.display = "block";
      locationBox.innerHTML =
        "خط العرض: " + lat + "<br>" +
        "خط الطول: " + lng + "<br>" +
        "الدقة التقريبية: " + Math.round(acc) + " متر<br><br>" +
        '<a class="download" target="_blank" href="https://maps.google.com/?q=' + lat + ',' + lng + '">فتح في خرائط Google</a>';

      setStatus("تم جلب الموقع الجغرافي بنجاح.");
    },
    function(error){
      setStatus("تعذر جلب الموقع: " + error.message);
    },
    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );
}
</script>

</body>
</html>
